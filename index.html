<!DOCTYPE html>
<html lang="pl" class="h-full dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyHub PDF & Notes</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PDF.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- html2pdf.js for exporting notes -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Quill Rich Text Editor -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

    <!-- SUPABASE CLIENT SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 3px; }
        .dark ::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
        .dark ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); }
        
        .dark .ql-toolbar { background-color: #1f2937; border-color: #374151 !important; border-top-left-radius: 0.75rem; border-top-right-radius: 0.75rem; }
        .dark .ql-container { border-color: #374151 !important; background-color: #111827; color: #f3f4f6; border-bottom-left-radius: 0.75rem; border-bottom-right-radius: 0.75rem; }
        .dark .ql-stroke { stroke: #9ca3af !important; }
        .dark .ql-fill { fill: #9ca3af !important; }
        .dark .ql-picker { color: #9ca3af !important; }
        .ql-editor { min-height: 200px; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 h-full flex flex-col font-sans transition-colors duration-200">

    <!-- Top Bar Navigation -->
    <header class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
            <!-- App Logo -->
            <div class="flex items-center space-x-3 cursor-pointer" id="appLogoHome">
                <div class="bg-gradient-to-tr from-brand-600 to-indigo-600 text-white p-2.5 rounded-xl shadow-md">
                    <i class="fa-solid fa-book-open text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight tracking-tight">StudyHub <span class="text-brand-600 dark:text-brand-500">PDF & Notes</span></h1>
                    <p class="text-xs text-gray-500 dark:text-gray-400">Twoje wirtualne biurko na studia</p>
                </div>
            </div>

            <!-- Global Search Bar -->
            <div class="flex-1 max-w-md">
                <div class="relative flex items-center">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 text-gray-400"></i>
                    <input type="text" id="globalSearchInput" placeholder="Szukaj (tytuł, treść, przedmiot, tagi, semestr)..." 
                           class="w-full pl-10 pr-9 py-2 text-sm bg-gray-100 dark:bg-gray-700 border-none rounded-xl focus:ring-2 focus:ring-brand-500 text-gray-900 dark:text-gray-100 placeholder-gray-500 transition">
                    <button id="clearSearchBtn" title="Wyczyść wyszukiwanie" class="hidden absolute right-3 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
                        <i class="fa-solid fa-circle-xmark"></i>
                    </button>
                </div>
            </div>

            <!-- Header Controls -->
            <div class="flex items-center space-x-2">
                <button id="themeToggleBtn" title="Tryb Ciemny/Jasny" class="p-2.5 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-xl transition">
                    <i class="fa-solid fa-moon dark:hidden text-lg"></i>
                    <i class="fa-solid fa-sun hidden dark:block text-lg text-amber-400"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <div class="flex-1 flex overflow-hidden max-w-7xl w-full mx-auto p-2 sm:p-4 gap-4">
        
        <!-- Sidebar Navigation -->
        <aside class="w-64 bg-white dark:bg-gray-800 rounded-2xl border border-gray-200 dark:border-gray-700 p-4 flex flex-col shrink-0 hidden md:flex shadow-sm">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Przedmioty</h2>
                <button id="addSubjectBtn" title="Dodaj Przedmiot" class="text-xs text-brand-600 hover:text-brand-700 dark:text-brand-400 font-bold flex items-center gap-1">
                    <i class="fa-solid fa-plus"></i> Dodaj
                </button>
            </div>

            <!-- Semester Dropdown Filter -->
            <div class="mb-3">
                <label class="block text-[10px] font-bold uppercase text-gray-400 mb-1">Filtruj wg Semestru</label>
                <select id="semesterFilter" class="w-full bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 text-xs rounded-xl px-3 py-2 font-medium">
                    <option value="ALL">Wszystkie Semestry</option>
                    <option value="1">Semestr 1</option>
                    <option value="2">Semestr 2</option>
                    <option value="3">Semestr 3</option>
                    <option value="4">Semestr 4</option>
                    <option value="5">Semestr 5</option>
                    <option value="6">Semestr 6</option>
                    <option value="7">Semestr 7</option>
                </select>
            </div>

            <!-- Dynamic Subject Nav -->
            <nav id="subjectNavList" class="flex-1 overflow-y-auto space-y-1 pr-1">
                <!-- Loaded Dynamically -->
            </nav>

            <hr class="my-3 border-gray-200 dark:border-gray-700">

            <!-- Storage Info -->
            <div class="text-xs text-gray-500 dark:text-gray-400 space-y-1">
                <div class="flex justify-between items-center">
                    <span>Status Bazy:</span>
                    <span id="dbStatusBadge" class="font-semibold text-brand-500 flex items-center gap-1">
                        <i class="fa-solid fa-circle text-[8px]"></i> Połączono
                    </span>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col min-w-0 bg-white dark:bg-gray-800 rounded-2xl border border-gray-200 dark:border-gray-700 overflow-hidden shadow-sm">
            
            <!-- Dashboard View Header -->
            <div class="p-4 sm:p-5 border-b border-gray-200 dark:border-gray-700 flex flex-wrap gap-3 items-center justify-between bg-gray-50/50 dark:bg-gray-800/50">
                <div>
                    <h2 id="currentSubjectTitle" class="text-xl font-bold text-gray-900 dark:text-white flex items-center gap-2">
                        <i class="fa-solid fa-layer-group text-brand-600"></i> Wszystkie Materiały
                    </h2>
                    <p id="currentSubjectSubtitle" class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">Pliki PDF oraz zapisane notatki studenckie</p>
                </div>

                <!-- Add Actions -->
                <div class="flex items-center space-x-2">
                    <button id="openNewNoteBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3.5 py-2 rounded-xl text-sm font-semibold transition flex items-center space-x-1.5 shadow-sm">
                        <i class="fa-solid fa-pen-to-square"></i>
                        <span>Nowa Notatka</span>
                    </button>
                    <label class="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-2 rounded-xl text-sm font-semibold transition flex items-center space-x-1.5 cursor-pointer shadow-sm">
                        <i class="fa-solid fa-file-circle-plus"></i>
                        <span id="uploadBtnText">Dodaj PDF</span>
                        <input type="file" id="pdfFileInput" accept="application/pdf" class="hidden">
                    </label>
                </div>
            </div>

            <!-- Content Filter Tabs -->
            <div class="px-5 pt-3 flex items-center space-x-4 border-b border-gray-100 dark:border-gray-700 text-sm">
                <button id="tabAll" class="filter-tab pb-2.5 font-bold text-brand-600 dark:text-brand-400 border-b-2 border-brand-600 dark:border-brand-400">
                    Wszystko (<span id="cntAll">0</span>)
                </button>
                <button id="tabPdfs" class="filter-tab pb-2.5 font-medium text-gray-500 dark:text-gray-400 hover:text-gray-800 dark:hover:text-gray-200">
                    Pliki PDF (<span id="cntPdfs">0</span>)
                </button>
                <button id="tabNotes" class="filter-tab pb-2.5 font-medium text-gray-500 dark:text-gray-400 hover:text-gray-800 dark:hover:text-gray-200">
                    Notatki (<span id="cntNotes">0</span>)
                </button>
            </div>

            <!-- Material Card Grid -->
            <div class="flex-1 overflow-y-auto p-4 sm:p-5">
                <div id="materialsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- Loaded dynamically -->
                </div>

                <!-- Empty Search & Filter State -->
                <div id="emptyState" class="hidden flex-col items-center justify-center py-16 text-center">
                    <div class="w-16 h-16 bg-gray-100 dark:bg-gray-700 text-gray-400 rounded-2xl flex items-center justify-center mb-3 text-2xl">
                        <i class="fa-solid fa-magnifying-glass-slash"></i>
                    </div>
                    <h3 class="text-base font-bold text-gray-800 dark:text-gray-200">Brak materiałów</h3>
                    <p class="text-xs text-gray-500 dark:text-gray-400 max-w-xs mt-1 mb-4">Dodaj nowy plik PDF lub stwórz pierwszą notatkę.</p>
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL: Subject Creation -->
    <div id="subjectModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 rounded-2xl w-full max
